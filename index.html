<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Engineering Console</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --border:    #30363d;
      --muted:     #8b949e;
      --text:      #e6edf3;
      --accent:    #58a6ff;
      --green:     #3fb950;
      --yellow:    #d29922;
      --red:       #f85149;
      --thinking:  #bc8cff;
      --radius:    6px;
      --font:      'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
    }

    html, body { height: 100%; }

    body {
      font-family: var(--font);
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 220px;
      min-width: 220px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      gap: 20px;
      overflow-y: auto;
    }

    .sidebar-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .cmd-group { display: flex; flex-direction: column; gap: 4px; }

    .cmd-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font);
      font-size: 12px;
      padding: 6px 10px;
      text-align: left;
      cursor: pointer;
      transition: background .15s, border-color .15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cmd-btn:hover { background: #21262d; border-color: var(--accent); }
    .cmd-btn .cmd-label { color: var(--accent); }
    .cmd-btn .cmd-desc  { color: var(--muted); font-size: 11px; }

    .divider { border: none; border-top: 1px solid var(--border); }

    .focus-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .focus-day {
      background: #21262d;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 5px 7px;
      font-size: 11px;
    }
    .focus-day .day  { color: var(--muted); }
    .focus-day .task { color: var(--text); }

    .today .focus-day { border-color: var(--accent); }

    #clear-btn {
      margin-top: auto;
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      font-family: var(--font);
      font-size: 11px;
      padding: 6px 10px;
      cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    #clear-btn:hover { color: var(--red); border-color: var(--red); }

    /* ── Main ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #header {
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
    }

    #header h1 { font-size: 13px; font-weight: 600; }
    #header .model-badge {
      font-size: 11px;
      background: #21262d;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 8px;
      color: var(--muted);
    }
    #status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      margin-left: auto;
    }
    #status-dot.busy { background: var(--yellow); }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg { display: flex; flex-direction: column; gap: 4px; max-width: 800px; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; align-items: flex-start; }

    .msg-role {
      font-size: 10px;
      letter-spacing: .06em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: var(--radius);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      max-width: 680px;
    }
    .msg.user .msg-bubble {
      background: #1c2d50;
      border: 1px solid #2d4070;
      color: var(--text);
    }
    .msg.assistant .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .thinking-block {
      background: #1a1030;
      border: 1px solid #3d2d60;
      border-radius: var(--radius);
      margin-bottom: 6px;
      overflow: hidden;
      max-width: 680px;
    }
    .thinking-header {
      font-size: 10px;
      color: var(--thinking);
      padding: 5px 10px;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid #3d2d6060;
    }
    .thinking-header:hover { background: #21103860; }
    .thinking-body {
      padding: 8px 12px;
      font-size: 11px;
      color: #9b7fd4;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
      max-height: 200px;
      overflow-y: auto;
    }
    .thinking-body.collapsed { display: none; }
    .thinking-chevron { transition: transform .2s; }
    .thinking-chevron.open { transform: rotate(90deg); }

    /* inline code */
    .msg-bubble code {
      background: #21262d;
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 1px 4px;
      font-size: 12px;
    }

    /* code blocks */
    .code-block {
      background: #161b22;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin: 6px 0;
      overflow: auto;
    }
    .code-block pre {
      padding: 12px 14px;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre;
    }

    .cursor {
      display: inline-block;
      width: 8px; height: 13px;
      background: var(--accent);
      vertical-align: middle;
      animation: blink .8s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── Input area ── */
    #input-area {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 12px 20px;
    }

    #input-wrap {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: #21262d;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      transition: border-color .15s;
    }
    #input-wrap:focus-within { border-color: var(--accent); }

    #prompt {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.5;
      resize: none;
      min-height: 24px;
      max-height: 180px;
      overflow-y: auto;
    }
    #prompt::placeholder { color: var(--muted); }

    #send-btn {
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      color: #0d1117;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      cursor: pointer;
      transition: opacity .15s;
      white-space: nowrap;
    }
    #send-btn:disabled { opacity: .4; cursor: not-allowed; }

    #hint {
      font-size: 10px;
      color: var(--muted);
      margin-top: 5px;
      padding-left: 2px;
    }

    /* empty state */
    #empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
      pointer-events: none;
    }
    #empty.hidden { display: none; }
    #empty .logo { font-size: 28px; }
    #empty p { font-size: 12px; }

    /* scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  </style>
</head>
<body>

<!-- Sidebar -->
<aside id="sidebar">
  <div>
    <div class="sidebar-title">Commands</div>
  </div>
  <div class="cmd-group">
    <button class="cmd-btn" data-cmd="/check ">
      <span>
        <div class="cmd-label">/check</div>
        <div class="cmd-desc">Risk audit</div>
      </span>
    </button>
    <button class="cmd-btn" data-cmd="/plan ">
      <span>
        <div class="cmd-label">/plan</div>
        <div class="cmd-desc">Plan improvements</div>
      </span>
    </button>
    <button class="cmd-btn" data-cmd="/execute">
      <span>
        <div class="cmd-label">/execute</div>
        <div class="cmd-desc">Run agreed plan</div>
      </span>
    </button>
  </div>

  <hr class="divider">

  <div>
    <div class="sidebar-title" style="margin-bottom:8px">Weekly focus</div>
    <div class="focus-grid" id="focus-grid"></div>
  </div>

  <button id="clear-btn">Clear conversation</button>
</aside>

<!-- Main -->
<div id="main">
  <div id="header">
    <h1>Claude Engineering Console</h1>
    <span class="model-badge">claude-opus-4-6</span>
    <div id="status-dot" title="Ready"></div>
  </div>

  <div id="messages">
    <div id="empty">
      <div class="logo">⚙</div>
      <p>Start with <code style="font-size:11px;background:#21262d;border:1px solid #30363d;border-radius:3px;padding:1px 5px">/check</code>, <code style="font-size:11px;background:#21262d;border:1px solid #30363d;border-radius:3px;padding:1px 5px">/plan</code>, or ask anything.</p>
    </div>
  </div>

  <div id="input-area">
    <div id="input-wrap">
      <textarea id="prompt" rows="1" placeholder="Ask Claude or use /check · /plan · /execute …"></textarea>
      <button id="send-btn">Send ↵</button>
    </div>
    <div id="hint">Enter to send · Shift+Enter for newline</div>
  </div>
</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let history = [];
  let busy = false;

  // ── Weekly focus ──────────────────────────────────────────────────────────
  const FOCUS = [
    ['Mon', 'Risk reduction'],
    ['Tue', 'Speed tooling'],
    ['Wed', 'Refactor debt'],
    ['Thu', 'Tests / safety'],
    ['Fri', 'Automation'],
  ];
  const todayIdx = new Date().getDay(); // 0=Sun, 1=Mon …
  const grid = document.getElementById('focus-grid');
  FOCUS.forEach(([day, task], i) => {
    const el = document.createElement('div');
    const isoDay = i + 1; // Mon=1
    el.className = 'focus-day' + (isoDay === todayIdx ? ' today' : '');
    el.innerHTML = `<div class="day">${day}</div><div class="task">${task}</div>`;
    grid.appendChild(el);
  });

  // ── Command buttons ────────────────────────────────────────────────────────
  document.querySelectorAll('.cmd-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const textarea = document.getElementById('prompt');
      textarea.value = btn.dataset.cmd;
      textarea.focus();
      autoResize(textarea);
    });
  });

  document.getElementById('clear-btn').addEventListener('click', () => {
    history = [];
    document.getElementById('messages').innerHTML = '';
    document.getElementById('empty').classList.remove('hidden');
  });

  // ── Input ──────────────────────────────────────────────────────────────────
  const textarea = document.getElementById('prompt');
  const sendBtn  = document.getElementById('send-btn');

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 180) + 'px';
  }

  textarea.addEventListener('input', () => autoResize(textarea));

  textarea.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!busy) send();
    }
  });

  sendBtn.addEventListener('click', () => { if (!busy) send(); });

  // ── Send ───────────────────────────────────────────────────────────────────
  async function send() {
    const text = textarea.value.trim();
    if (!text) return;

    textarea.value = '';
    autoResize(textarea);

    document.getElementById('empty').classList.add('hidden');
    addMessage('user', text);
    history.push({ role: 'user', content: text });

    setBusy(true);
    const aEl = addMessage('assistant', '');
    const bubble = aEl.querySelector('.msg-bubble');
    let thinkingEl = null;
    let thinkingBody = null;
    let thinkingText = '';
    let responseText = '';

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      });

      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });

        const lines = buf.split('\n');
        buf = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const payload = JSON.parse(line.slice(6));

          if (payload.type === 'thinking') {
            thinkingText += payload.text;
            if (!thinkingEl) {
              thinkingEl = document.createElement('div');
              thinkingEl.className = 'thinking-block';
              thinkingEl.innerHTML = `
                <div class="thinking-header">
                  <span class="thinking-chevron open">▶</span>
                  <span>Thinking…</span>
                </div>
                <div class="thinking-body"></div>`;
              aEl.insertBefore(thinkingEl, bubble);
              thinkingBody = thinkingEl.querySelector('.thinking-body');
              thinkingEl.querySelector('.thinking-header').addEventListener('click', () => {
                thinkingBody.classList.toggle('collapsed');
                thinkingEl.querySelector('.thinking-chevron').classList.toggle('open');
              });
            }
            thinkingBody.textContent = thinkingText;
            thinkingBody.scrollTop = thinkingBody.scrollHeight;
          }

          if (payload.type === 'text') {
            responseText += payload.text;
            renderBubble(bubble, responseText, true);
            document.getElementById('messages').scrollTop = 1e9;
          }

          if (payload.type === 'done') {
            renderBubble(bubble, responseText, false);
            if (thinkingEl) {
              thinkingEl.querySelector('.thinking-header span:last-child').textContent = 'Thinking';
              thinkingBody.classList.add('collapsed');
              thinkingEl.querySelector('.thinking-chevron').classList.remove('open');
            }
            history.push({ role: 'assistant', content: responseText });
          }

          if (payload.type === 'error') {
            bubble.innerHTML = `<span style="color:var(--red)">${escHtml(payload.text)}</span>`;
          }
        }
      }
    } catch (err) {
      bubble.innerHTML = `<span style="color:var(--red)">Connection error: ${escHtml(err.message)}</span>`;
    }

    setBusy(false);
    document.getElementById('messages').scrollTop = 1e9;
  }

  // ── Render ─────────────────────────────────────────────────────────────────
  function addMessage(role, text) {
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;
    wrap.innerHTML = `
      <div class="msg-role">${role}</div>
      <div class="msg-bubble"></div>`;
    if (text) renderBubble(wrap.querySelector('.msg-bubble'), text, false);
    document.getElementById('messages').appendChild(wrap);
    document.getElementById('messages').scrollTop = 1e9;
    return wrap;
  }

  function renderBubble(el, text, streaming) {
    // Simple markdown: code blocks, inline code, bold
    let html = escHtml(text)
      .replace(/```([\s\S]*?)```/g, (_, code) =>
        `<div class="code-block"><pre>${code.trimEnd()}</pre></div>`)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

    el.innerHTML = html + (streaming ? '<span class="cursor"></span>' : '');
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function setBusy(val) {
    busy = val;
    sendBtn.disabled = val;
    document.getElementById('status-dot').className = val ? 'busy' : '';
    document.getElementById('status-dot').title = val ? 'Thinking…' : 'Ready';
  }
</script>
</body>
</html>
