name: Weekly Permits Sync

on:
  schedule:
    # Every Monday at 08:00 Toronto time (EDT = UTC-4 → 12:00 UTC)
    # Adjust to 13:00 UTC during EST (UTC-5, Nov–Mar)
    - cron: "0 12 * * 1"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      force_diff:
        description: "Force diff even if snapshot already exists today"
        required: false
        default: "false"

jobs:
  sync:
    name: Fetch & Diff Toronto Permits
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit snapshots back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need previous commit for git diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No third-party deps — scripts use only stdlib
      - name: Fetch latest permit snapshot
        run: python scripts/fetch_permits.py

      - name: Diff against previous snapshot
        run: python scripts/diff_permits.py
        # diff_permits.py auto-detects the two most recent dated snapshots

      - name: Show report preview
        run: |
          REPORT=$(ls -t data/reports/diff_*.md 2>/dev/null | head -1)
          if [ -n "$REPORT" ]; then
            echo "=== Report: $REPORT ==="
            head -60 "$REPORT"
          else
            echo "No report generated."
          fi

      - name: Commit snapshots and report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only data files — never commit credentials or unrelated changes
          git add data/snapshots/ data/reports/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            TODAY=$(date -u +%Y-%m-%d)
            git commit -m "chore(permits): weekly sync $TODAY

  Auto-generated by weekly-permits-sync workflow.
  Snapshot and diff report committed for $TODAY."
            git push origin HEAD
          fi

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: permits-diff-report
          path: data/reports/
          retention-days: 90
